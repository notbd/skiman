[package]
name = "skiman"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Keeps agent skills and global instruction files in one git repo and distributes them to every agent tool"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13.1"
saphyr = { version = "0.3.3", default-features = false }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
toml_edit = "0.25.18"
unicode-normalization = "0.1.26"

[dev-dependencies]
rexpect = "0.7"
snapbox = { version = "1.2", features = ["cmd"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
